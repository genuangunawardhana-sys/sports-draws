<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salesianum Pickleball Tournament</title>
<meta name="description" content="Live scores, court assignments and playoff brackets for the Salesianum Tennis pickleball FUNraiser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#13213F; --muted:#5B6782; --line:#D5DCE8;
  --blue:#1E4DB7; --blue-ink:#FFFFFF; --blue-soft:#E3EBFB; --blue-text:#1E4DB7;
  --gold:#F2B705; --gold-ink:#2B2100; --gold-soft:#FDF3CF; --gold-text:#8A6500;
  --danger:#B42318; --win:#127A4B;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1524; --surface:#16213A; --surface-2:#1C2944; --ink:#E7ECF6; --muted:#9AA6C2; --line:#2B3A5C;
    --blue:#3D6FE0; --blue-soft:#1C2D55; --blue-text:#8FB0FF;
    --gold:#F2B705; --gold-soft:#3A2F07; --gold-text:#F5C93A;
    --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#16213A; --surface-2:#1C2944; --ink:#E7ECF6; --muted:#9AA6C2; --line:#2B3A5C;
  --blue:#3D6FE0; --blue-soft:#1C2D55; --blue-text:#8FB0FF;
  --gold:#F2B705; --gold-soft:#3A2F07; --gold-text:#F5C93A;
  --danger:#FF8A80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45;
  --accent:var(--blue); --accent-ink:var(--blue-ink); --accent-soft:var(--blue-soft); --accent-text:var(--blue-text);
}
.wrap{max-width:1120px; margin:0 auto; padding:0 16px}
button,select,input{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent-text); outline-offset:2px}
.muted{color:var(--muted)}
h2,h3,h4{font-stretch:78%; line-height:1.1; margin:0}
h2{font-size:1.7rem; font-weight:800}
h3{font-size:1.3rem; font-weight:800}
h4{font-size:.95rem; font-weight:700; color:var(--muted); font-stretch:90%}

/* Header: the court */
header.court{position:relative; overflow:hidden; background:var(--accent); color:var(--accent-ink); transition:background .25s}
header.court svg{position:absolute; inset:0; width:100%; height:100%}
header.court svg *{fill:none; stroke:currentColor; stroke-opacity:.38; stroke-width:2; vector-effect:non-scaling-stroke}
header.court svg .net{stroke-opacity:.7; stroke-width:4; stroke-dasharray:2 6}
.head{position:relative; display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; justify-content:space-between; padding-top:34px; padding-bottom:26px}
.head h1{margin:0; font-stretch:68%; font-weight:800; font-size:clamp(2.1rem,6.5vw,3.6rem); line-height:.95; letter-spacing:-.01em; max-width:16ch}
.head .school{margin:0 0 .35rem; font-weight:700; font-size:1rem; letter-spacing:.01em}
.head .tagline{margin:.45rem 0 0; font-stretch:85%; font-weight:700; font-size:clamp(1.05rem,2.6vw,1.3rem)}
.head .sub{margin:.6rem 0 0; font-weight:600; opacity:.9}
.head .sync{margin:.15rem 0 0; font-size:.85rem; opacity:.85}
.divswitch{display:inline-flex; gap:4px; padding:4px; border-radius:999px; background:rgba(0,0,0,.2)}
.divswitch button{border:0; background:none; color:inherit; padding:9px 16px; border-radius:999px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:44px}
.divswitch button[aria-pressed="true"]{background:var(--surface); color:var(--ink)}
.dot{width:12px; height:12px; border-radius:50%; display:inline-block; border:2px solid rgba(255,255,255,.8)}


nav.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex; overflow-x:auto; gap:2px}
nav.tabs button{border:0; background:none; padding:14px 14px 11px; border-bottom:3px solid transparent; font-weight:650; color:var(--muted); cursor:pointer; white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink); border-bottom-color:var(--accent)}
nav.tabs button.admin{margin-left:auto; color:var(--accent-text)}
nav.tabs button.admin.on{color:var(--ink)}
nav.tabs button.admin.on::before{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--win); margin-right:8px; vertical-align:middle}
.trow.ro{grid-template-columns:minmax(0,1fr) auto}

main{padding-top:22px; padding-bottom:60px}
.toolbar{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between; margin-bottom:18px}
.toolbar p{margin:.25rem 0 0}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.btn{border:0; border-radius:8px; padding:10px 15px; min-height:44px; background:var(--accent); color:var(--accent-ink); font-weight:700; cursor:pointer}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
.btn.danger{background:var(--danger); color:#fff}
.btn.ghost.danger{background:none; color:var(--danger); border-color:var(--danger)}
.link{border:0; background:none; color:var(--accent-text); font-weight:700; cursor:pointer; padding:6px 4px}
.seg{display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--surface)}
.seg span{padding:0 8px 0 10px; font-size:.85rem; color:var(--muted)}
.seg button{border:0; background:none; padding:7px 12px; border-radius:999px; font-weight:650; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.note{font-size:.9rem; color:var(--muted); margin:-6px 0 18px; max-width:72ch}
select.inl{padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); min-height:40px}

.empty{border:2px dashed var(--line); border-radius:12px; padding:28px; text-align:left; background:var(--surface-2)}
.empty h3{margin-bottom:.35rem}
.empty p{margin:0 0 14px; color:var(--muted)}

/* Groups */
.group{background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--accent); border-radius:12px; padding:16px; margin-bottom:18px}
.ghead{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin-bottom:12px}
.ghead .link{margin-left:auto}
.gbody{display:grid; gap:18px}
@media (min-width:860px){ .gbody{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)} }
.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
th,td{padding:8px 7px; text-align:right; border-bottom:1px solid var(--line); vertical-align:top}
th{font-size:.8rem; color:var(--muted); font-weight:600}
th.tm,td.tm{text-align:left}
td.rk{color:var(--muted); width:1.5em}
td.tm strong{display:block}
td.tm small{color:var(--muted)}
.key{background:var(--accent-soft); font-weight:700}
tr.lead td.tm strong::after{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-left:8px; vertical-align:middle}
.round{margin-bottom:12px}
.round h4{margin-bottom:6px}
.round .stack{display:grid; gap:8px}
.sits{font-size:.85rem; color:var(--muted); margin:6px 0 0}

/* Match card (scoreboard) */
.match{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 12px; cursor:pointer; min-height:58px}
button.match:hover{border-color:var(--accent-text)}
div.match{cursor:default}
.match.pending{background:var(--surface-2)}
.match .ct{font-weight:800; font-size:.8rem; font-stretch:80%; color:var(--muted); min-width:3.4em}
.match .ct.on{color:var(--accent-text)}
.lines2{display:grid; gap:2px; min-width:0}
.tl{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.tl .tn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tl .sc{font-variant-numeric:tabular-nums; font-weight:800; min-width:2ch; text-align:right; font-size:1.05rem}
.tl.w{font-weight:750}
.tl.l{color:var(--muted)}
.tl.tbd{color:var(--muted); font-style:italic}
.seed{display:inline-block; min-width:1.6em; font-size:.75rem; font-weight:800; color:var(--muted)}
.match .cta{font-size:.85rem; font-weight:750; color:var(--accent-text)}

/* Courts */
.courts{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ctile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; border-top:6px solid var(--line)}

.cnum{font-stretch:65%; font-weight:800; font-size:2.2rem; line-height:1}
.ctx{font-size:.85rem; color:var(--muted); margin:10px 0 6px}
.nxt{font-size:.9rem; margin:10px 0 0}
.nxt span{color:var(--muted)}

/* Teams */
.tlist{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.trow{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow small{display:block; color:var(--muted)}
.trow.un{background:var(--accent-soft)}

/* Playoffs */
.bracket{display:flex; gap:22px; overflow-x:auto; padding-bottom:10px}
.bcol{min-width:240px; flex:1 0 240px; display:flex; flex-direction:column}
.bcol h4{margin-bottom:10px}
.bms{display:flex; flex-direction:column; justify-content:space-around; gap:12px; flex:1}
.bye{border:1px dashed var(--line); border-radius:10px; padding:10px 12px; font-size:.9rem; color:var(--muted)}
.bye strong{color:var(--ink)}
.champ{display:flex; flex-direction:column; justify-content:center; min-width:200px}
.champ .cbox{background:var(--accent); color:var(--accent-ink); border-radius:12px; padding:18px}
.champ .cbox h3{font-size:1.6rem; font-stretch:68%}
.champ .cbox p{margin:.3rem 0 0}
details.seeds{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-top:22px}
details.seeds summary{cursor:pointer; font-weight:700}
.seedgrid{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); margin-top:12px}
.seedgrid label{display:flex; gap:8px; align-items:center}
.seedgrid label b{min-width:2.2em; font-variant-numeric:tabular-nums}
.seedgrid select{flex:1; min-width:0}

.rules{background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--accent); border-radius:12px; padding:16px; margin-bottom:20px}
.rules h3{margin-bottom:12px}
.rgrid{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.summary{margin:14px 0 0; padding:12px 14px; background:var(--accent-soft); border-radius:8px; font-weight:600; max-width:80ch}
.hint{font-size:.88rem; color:var(--muted); margin:8px 0 0; max-width:80ch}
.stale{margin:0 0 16px; padding:10px 14px; border:1px solid var(--accent-text); border-radius:8px; font-weight:650; color:var(--accent-text)}
.qtable{margin-top:10px}
tr.cut td{padding:3px 7px; font-size:.78rem; font-weight:800; color:var(--accent-text); border-bottom:2px dashed var(--accent-text); text-align:left}
tr.out td{color:var(--muted)}
tr.out td strong{font-weight:500}
.tag{display:inline-block; font-size:.75rem; font-weight:750; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent-text); white-space:nowrap}
.tag.wild{background:var(--surface-2); border:1px solid var(--line); color:var(--ink)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.divlist{display:grid; gap:10px}
.divrow{display:grid; grid-template-columns:48px minmax(0,1fr) auto auto; gap:10px; align-items:center}
.divrow input[type=color]{width:48px; height:44px; padding:2px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); cursor:pointer}
.divrow input[type=text]{padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); min-height:44px; min-width:0}
.link.danger{color:var(--danger)}
/* Settings */
.form{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; display:grid; gap:14px; max-width:640px; margin-bottom:18px}
.field{display:grid; gap:6px; font-weight:650}
.field input,.field select{padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); font-weight:400; min-height:44px}
.field small{font-weight:400; color:var(--muted)}
.two{display:grid; gap:14px; grid-template-columns:1fr 1fr}

/* Dialogs */
dialog{border:0; border-radius:14px; padding:0; width:min(540px,94vw); background:var(--surface); color:var(--ink); box-shadow:0 20px 60px rgba(8,16,36,.35)}
dialog::backdrop{background:rgba(8,16,36,.5)}
.sheet{padding:20px; display:grid; gap:16px}
.sheet h3{font-size:1.35rem}
.actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end}
.sides{display:grid; gap:12px}
.side{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2)}
.side .who strong{display:block; font-size:1.05rem}
.side .who span{font-size:.85rem; color:var(--muted)}
.stepper{display:flex; align-items:center; gap:6px}
.stepper button{width:48px; height:48px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:1.5rem; font-weight:700; cursor:pointer}
.stepper input{width:3.2ch; box-sizing:content-box; padding:4px 6px; text-align:center; font-size:2.2rem; font-weight:800; font-stretch:75%; font-variant-numeric:tabular-nums; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
.err{color:var(--danger); font-weight:650; margin:0}
#toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:12px 16px; border-radius:10px; font-weight:600; max-width:min(92vw,520px); z-index:50; display:none}
#toast.show{display:block}
.loading{padding:60px 16px; color:var(--muted)}
@media (max-width:560px){ .two{grid-template-columns:1fr} .trow{grid-template-columns:minmax(0,1fr) auto} .trow .grpsel{grid-column:1/-1} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body data-div="blue">
<div id="app"><div class="wrap loading">Loading tracker…</div></div>
<dialog id="dlg"></dialog>
<dialog id="cfm"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const app=$('#app'), dlg=$('#dlg'), cfm=$('#cfm');
const SAMPLE_DIVS=['blue','gold'];
const DEF_DIVS=[{id:'blue',name:'Blue',color:'#1E4DB7'},{id:'gold',name:'Gold',color:'#F2B705'}];
const PALETTE=['#8C1D40','#1E7A46','#5B2A86','#E0701B','#0E7C86','#C8102E','#4A4A4A'];
const COLS=['teams','groups','matches','pmatches','playoff'];
const S={meta:{},teams:{},groups:{},matches:{},pmatches:{},playoff:{}};
let booted=false, renderPending=false, modal=null;
let view='groups', curDiv='blue';
let isAdmin=false, token=null;
try{const t=JSON.parse(localStorage.getItem('pbt-token')||'null'); if(t&&t.exp>Date.now()){token=t.token; isAdmin=true;}}catch(e){}
function setToken(t){token=t?t.token:null; isAdmin=!!t; try{t?localStorage.setItem('pbt-token',JSON.stringify(t)):localStorage.removeItem('pbt-token')}catch(e){}}
try{const u=JSON.parse(localStorage.getItem('pbt-ui')||'{}'); if(u.view) view=u.view; if(u.div) curDiv=u.div;}catch(e){}
function saveUI(){try{localStorage.setItem('pbt-ui',JSON.stringify({view,div:curDiv}))}catch(e){}}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>typeof v==='number'&&isFinite(v);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const DEF_META={school:'Salesianum School',eventName:'Pickleball Tournament',tagline:'A FUNraiser for Salesianum Tennis',courts:10,scoring:'wins'};
function meta(){const m=Object.assign({},DEF_META,S.meta||{}); if(m.eventName==='School Pickleball Fundraiser') m.eventName=DEF_META.eventName; const nm=(S.meta&&S.meta.names)||{}; m.divisions=(Array.isArray(m.divisions)&&m.divisions.length?m.divisions:DEF_DIVS.map(d=>Object.assign({},d,{name:nm[d.id]||d.name}))).map(d=>Object.assign({},d)); delete m.names; return m;}
const divs=()=>meta().divisions;
const divIds=()=>divs().map(d=>d.id);
const divOf=id=>divs().find(d=>d.id===id);
const divName=id=>{const d=divOf(id); return d?d.name:'Division';};
const divColor=id=>{const d=divOf(id); return d&&d.color||'#1E4DB7';};
function lum(hex){const h=String(hex).replace('#',''); if(h.length<6) return .3; const c=[0,2,4].map(i=>{const v=parseInt(h.substr(i,2),16)/255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);}); return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function applyAccent(){const ids=divIds(); if(!ids.includes(curDiv)) curDiv=ids[0]; const c=divColor(curDiv), light=lum(c)>.4, dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches, st=document.body.style; st.setProperty('--accent',c); st.setProperty('--accent-ink',light?'#13213F':'#FFFFFF'); st.setProperty('--accent-soft',`color-mix(in srgb, ${c} ${dark?24:15}%, var(--surface))`); st.setProperty('--accent-text',`color-mix(in srgb, ${c} ${dark?55:(light?45:85)}%, var(--ink))`);}
const team=id=>S.teams[id]?Object.assign({id},S.teams[id]):null;
const players=t=>t?[t.p1,t.p2].filter(Boolean).join(' & '):'';
function teamsIn(div){return Object.keys(S.teams).map(team).filter(t=>t.div===div).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name));}
function groupsIn(div){return Object.keys(S.groups).map(id=>Object.assign({id},S.groups[id])).filter(g=>g.div===div).sort((a,b)=>String(a.name).localeCompare(b.name,undefined,{numeric:true})||(a.order||0)-(b.order||0));}
function members(gid){return Object.keys(S.teams).map(team).filter(t=>t.group===gid).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name));}
function mkey(gid,a,b){const p=a<b?[a,b]:[b,a]; return gid+'--'+p[0]+'--'+p[1];}
function readMatch(gid,a,b){const m=S.matches[mkey(gid,a,b)]; if(!m) return {}; return a<b?{sa:m.sa,sb:m.sb,court:m.court}:{sa:m.sb,sb:m.sa,court:m.court};}
function defaultCourt(g,pi){return g.courts&&g.courts.length?g.courts[pi%g.courts.length]:null;}
function rrRounds(ids){const t=ids.slice(); if(t.length<2) return []; if(t.length%2) t.push(null); const n=t.length, out=[]; for(let r=0;r<n-1;r++){const pairs=[]; for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i]; if(a&&b) pairs.push([a,b]);} out.push(pairs); t.splice(1,0,t.pop());} return out;}
function nextLetter(div){const used=new Set(groupsIn(div).map(g=>g.name)); for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') if(!used.has(c)) return c; return String(used.size+1);}

/* ---------- standings ---------- */
function groupStandings(g){
  const mem=members(g.id), rows=new Map(mem.map(t=>[t.id,{t,P:0,W:0,L:0,PF:0,PA:0}]));
  const rounds=rrRounds(mem.map(t=>t.id)), beat={};
  rounds.forEach(pairs=>pairs.forEach(([a,b])=>{
    const r=readMatch(g.id,a,b); if(!(num(r.sa)&&num(r.sb))) return;
    const A=rows.get(a),B=rows.get(b); A.P++;B.P++; A.PF+=r.sa;A.PA+=r.sb;B.PF+=r.sb;B.PA+=r.sa;
    if(r.sa>r.sb){A.W++;B.L++;beat[a+'>'+b]=1;} else if(r.sb>r.sa){B.W++;A.L++;beat[b+'>'+a]=1;}
  }));
  const D=x=>x.PF-x.PA, list=[...rows.values()];
  if(meta().scoring==='points') list.sort((x,y)=>y.PF-x.PF||y.W-x.W||D(y)-D(x)||String(x.t.name).localeCompare(y.t.name));
  else{
    list.sort((x,y)=>y.W-x.W||D(y)-D(x)||y.PF-x.PF||String(x.t.name).localeCompare(y.t.name));
    for(let i=0;i<list.length-1;i++){const x=list[i],y=list[i+1]; if(x.W===y.W&&list.filter(z=>z.W===x.W).length===2&&beat[y.t.id+'>'+x.t.id]){list[i]=y;list[i+1]=x;i++;}}
  }
  return {rows:list,rounds,mem};
}
/* ---------- playoff qualification ---------- */
const METRICS={
  winpct:{label:'Win percentage',fair:true,chain:['wp','dpg','ppg'],ties:'point differential per game, then points per game',fmt:s=>s.P?Math.round(s.wp*100)+'%':'–'},
  ppg:{label:'Points per game',fair:true,chain:['ppg','wp','dpg'],ties:'win percentage, then point differential per game',fmt:s=>s.P?s.ppg.toFixed(1):'–'},
  diff:{label:'Point differential per game',fair:true,chain:['dpg','wp','ppg'],ties:'win percentage, then points per game',fmt:s=>s.P?(s.dpg>0?'+':'')+s.dpg.toFixed(1):'–'},
  wins:{label:'Total wins',fair:false,chain:['W','D','PF'],ties:'point differential, then points won',fmt:s=>s.W},
  points:{label:'Total points won',fair:false,chain:['PF','W','D'],ties:'total wins, then point differential',fmt:s=>s.PF}
};
const DEF_RULES={count:4,mode:'group',perGroup:1,metric:'winpct'};
function rulesFor(div){const pc=S.playoff[div]||{}; const r=Object.assign({},DEF_RULES,pc.rules||{}); if(!METRICS[r.metric]) r.metric='winpct'; return r;}
function nextPow2(n){let p=2; while(p<n) p*=2; return p;}
const ordinal=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:Math.min(n%10,4)%4]||'th');
function statOf(r){const P=r.P||0, pg=x=>P?x/P:0; return {P,W:r.W,L:r.L,PF:r.PF,D:r.PF-r.PA,wp:pg(r.W),ppg:pg(r.PF),dpg:pg(r.PF-r.PA)};}
function cmpBy(metric){const chain=METRICS[metric].chain; return (a,b)=>{for(const k of chain){if(b.s[k]!==a.s[k]) return b.s[k]-a.s[k];} return String(a.name).localeCompare(b.name);};}
function qualify(div){
  const R=rulesFor(div), cmp=cmpBy(R.metric), all=[];
  groupsIn(div).forEach(g=>groupStandings(g).rows.forEach((r,i)=>all.push({id:r.t.id,name:r.t.name,group:g.name,size:g.size,place:i+1,s:statOf(r)})));
  const count=Math.max(0,Math.min(R.count,all.length));
  let ordered, autoCount=0;
  if(R.mode==='group'){
    const a=all.filter(x=>x.place<=R.perGroup).sort((x,y)=>x.place-y.place||cmp(x,y));
    const b=all.filter(x=>x.place>R.perGroup).sort(cmp);
    a.forEach(x=>x.tag='auto'); b.forEach(x=>x.tag='wild'); ordered=a.concat(b); autoCount=a.length;
  } else {ordered=all.slice().sort(cmp); ordered.forEach(x=>x.tag='overall');}
  ordered.forEach((x,i)=>{x.seed=i<count?i+1:null;});
  const size=count>=2?nextPow2(count):0, seeds=ordered.slice(0,count).map(x=>x.id);
  while(seeds.length<size) seeds.push('');
  const groupSizes=new Set(groupsIn(div).map(g=>members(g.id).length));
  return {R,ordered,count,size,seeds,autoCount,uneven:groupSizes.size>1};
}
function rulesSummary(q,div){
  const R=q.R, m=METRICS[R.metric].label.toLowerCase(); let s='';
  if(!q.count) return 'Add groups and teams to see who qualifies.';
  if(R.mode==='group'){
    const per=R.perGroup===1?'The winner of each group qualifies':`The top ${R.perGroup} in each group qualify`;
    const wild=Math.max(0,q.count-q.autoCount);
    s=`${per} automatically (${q.autoCount} team${q.autoCount===1?'':'s'}).`;
    if(q.autoCount>q.count) s+=` There are only ${q.count} spots, so the lowest-ranked automatic qualifiers by ${m} miss out.`;
    else if(wild) s+=` The ${wild===1?'best remaining team':wild+' best remaining teams'} by ${m} ${wild===1?'takes a wildcard spot':'take wildcard spots'}.`;
    s+=' Automatic qualifiers are seeded above wildcards.';
  } else s=`The ${q.count} best teams by ${m} qualify, regardless of group.`;
  const byes=q.size-q.count;
  const art=q.size===8?'an':'a';
  s+=byes?` That makes ${art} ${q.size}-team bracket, so the top ${byes===1?'seed gets':byes+' seeds get'} a first-round bye.`:` That makes ${art} ${q.size}-team bracket with no byes.`;
  return s;
}

/* ---------- bracket ---------- */
function seedOrder(n){let o=[1]; while(o.length<n){const m=o.length*2+1; o=o.flatMap(s=>[s,m-s]);} return o;}
function roundName(n,r){const left=n/Math.pow(2,r-1); return left===2?'Final':left===4?'Semifinals':left===8?'Quarterfinals':'Round of '+left;}
function bracket(div){
  const pc=S.playoff[div]; if(!pc||!pc.size) return null;
  const n=pc.size, order=seedOrder(n), R=Math.log2(n), rounds=[]; let prev=null;
  for(let r=1;r<=R;r++){
    const cnt=n/Math.pow(2,r), ms=[];
    for(let i=0;i<cnt;i++){
      let a,b,seedA=null,seedB=null,bye=false;
      if(r===1){seedA=order[2*i];seedB=order[2*i+1]; a=(pc.seeds||[])[seedA-1]||null; b=(pc.seeds||[])[seedB-1]||null; bye=!a||!b;}
      else{a=prev[2*i].winner; b=prev[2*i+1].winner;}
      const id=div+'--r'+r+'m'+i, res=S.pmatches[id]||{};
      let winner=null;
      if(bye) winner=a||b;
      else if(a&&b&&num(res.sa)&&num(res.sb)&&res.sa!==res.sb) winner=res.sa>res.sb?a:b;
      ms.push({id,r,i,a,b,seedA,seedB,bye,sa:res.sa,sb:res.sb,court:res.court==null?null:res.court,winner});
    }
    rounds.push(ms); prev=ms;
  }
  return rounds;
}

/* ---------- storage (Vercel API) ---------- */
let ver=0, pendingWrites=0, writeEpoch=0, sendChain=Promise.resolve();
async function api(path,body){
  const res=await fetch(path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{}),body:JSON.stringify(body)});
  let j=null; try{j=await res.json();}catch(e){}
  if(!res.ok){const err=new Error((j&&j.error)||'Request failed'); err.status=res.status; throw err;}
  return j;
}
function applyState(j){
  COLS.forEach(c=>{S[c]=j[c]||{};}); S.meta=j.meta||{}; ver=j.ver||0;
  if(!booted){booted=true; render();} else scheduleRender();
}
function send(body){
  pendingWrites++;
  const p=sendChain.then(()=>api('/api/write',body)).then(r=>{
    // Only the last queued write applies the server's copy, so later optimistic edits aren't undone.
    if(r&&r.state&&pendingWrites===1&&(r.state.ver||0)>=ver) applyState(r.state);
    return r;
  }).catch(handleErr).finally(()=>{pendingWrites--; writeEpoch++;});
  sendChain=p; return p;
}
function put(col,id,data){
  if(col==='meta') S.meta=data; else S[col][id]=data;
  render(); return send({ops:[{col,id,data}]});
}
function del(col,id){
  if(col==='meta') S.meta={}; else delete S[col][id];
  render(); return send({ops:[{col,id,del:true}]});
}
async function writeMany(ops,label){
  for(let i=0;i<ops.length;i+=150){
    await send({ops:ops.slice(i,i+150)});
    if(label) toast(label+' '+Math.min(ops.length,i+150)+' of '+ops.length,true);
  }
  toast('Done');
}
let lastErr=0;
function handleErr(e){
  const st=e&&e.status;
  if(st===401){setToken(null); render(); toast('Admin session ended. Unlock admin again to keep editing.'); poll(true); return;}
  const now=Date.now(); if(now-lastErr<2500) return; lastErr=now;
  if(st===400||st===413) toast('That change couldn’t be saved: '+(e.message||'invalid data')+'.');
  else if(st) toast('Save failed ('+st+'): '+(e.message||'server error'));
  else toast('A change didn’t save. Check your connection and try again.');
  poll(true);
}
let toastT;
function toast(msg,sticky){const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),sticky?8000:3200);}
function scheduleRender(){const a=document.activeElement; if(a&&app.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){renderPending=true;return;} render();}
app.addEventListener('focusout',()=>{if(renderPending){renderPending=false; setTimeout(render,0);}});

function groupBlock(g,m){

  }
  const M=METRICS[R.metric];

  q.ordered.forEach((x,i)=>{

  });
  h+='</tbody></table></div></details>';
  if(hasBr&&isAdmin){

  }

}

function matchesPerRound(size){return Math.floor((Number(size)||0)/2);}
function courtHint(size){const n=matchesPerRound(size); return `Matches in each round fill these courts in order. A group of ${size} plays ${n} match${n===1?'':'es'} at a time, so give it ${n} court${n===1?'':'s'}.`;}
// First courts not already used by another group in this division, wrapping within the court count.
function suggestCourts(size,exceptId){
  const total=meta().courts, need=matchesPerRound(size), used=new Set();
  groupsIn(curDiv).forEach(g=>{if(g.id!==exceptId)(g.courts||[]).forEach(c=>used.add(c));});
  const out=[]; for(let c=1;c<=total&&out.length<need;c++) if(!used.has(c)) out.push(c);
  return out.length===need?out:[];
}

function showErr(msg){const e=dlg.querySelector('.err'); if(e){e.textContent=msg; e.hidden=false;}}
const intOrNull=v=>{if(v===''||v==null) return null; const n=Math.round(Number(v)); return isFinite(n)&&n>=0?n:NaN;};

dlg.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act;
  if(act==='close') return close();
  if(act==='inc'||act==='dec'){const i=dlg.querySelector(`input[name="${b.dataset.f}"]`); const v=Number(i.value)||0; i.value=act==='inc'?Math.min(99,v+1):Math.max(0,v-1); return;}
  if(act==='clearscore'&&modal){
    if(modal.kind==='pool'){const k=mkey(modal.gid,modal.a,modal.b), cur=S.matches[k]; close(); if(cur&&cur.court!=null) put('matches',k,Object.assign({},cur,{sa:null,sb:null})); else del('matches',k);}
    else{const cur=S.pmatches[modal.id]; close(); if(cur&&cur.court!=null) put('pmatches',modal.id,{sa:null,sb:null,court:cur.court}); else del('pmatches',modal.id);}
    toast('Score cleared'); return;
  }
  if(act==='delgroup'&&modal){
    const id=modal.id, g=S.groups[id]; close();

    members(id).forEach(t=>{const c=Object.assign({},S.teams[t.id],{group:''}); put('teams',t.id,c);});
    Object.keys(S.matches).filter(k=>S.matches[k].group===id).forEach(k=>del('matches',k));
    del('groups',id); toast('Group deleted'); return;
  }
  if(act==='delteam'&&modal){

    if(!(await askConfirm(`Delete ${t.name}? Their pool scores stop counting.`,'Delete team'))) return;
    const ops=[{col:'teams',id,del:true}];
    Object.keys(S.matches).forEach(k=>{const m=S.matches[k]; if(m.a===id||m.b===id){ops.push({col:'matches',id:k,del:true}); delete S.matches[k];}});
    delete S.teams[id]; render(); await send({ops}); toast('Team deleted');
  }
});
dlg.addEventListener('change',e=>{if(e.target.name==='size'&&modal&&modal.kind==='group'){const h=dlg.querySelector('#courthint'); if(h) h.textContent=courtHint(e.target.value); const c=dlg.querySelector('input[name=courts]'); if(c){const sg=suggestCourts(Number(e.target.value),modal.id); c.placeholder=sg.join(', ')||'Court numbers, separated by commas'; if(!modal.id&&c.dataset.auto==='1') c.value=sg.join(', ');}} if(e.target.name==='div'){const g=dlg.querySelector('select[name=group]'); g.innerHTML=groupOpts(e.target.value,'');}});
dlg.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f), kind=f.dataset.form;
  if(kind==='pw'){
    const btn=f.querySelector('button[type=submit]'); btn.disabled=true;
    try{const t=await api('/api/login',{password:String(fd.get('pw')||'')}); setToken(t); close(); render(); toast('Admin mode on');}
    catch(x){showErr(x.status===401?'That password isn’t right.':x.status===429?'Too many tries. Wait a few minutes and try again.':(x.message||'Couldn’t reach the server.')); const i=f.querySelector('input'); i.value=''; i.focus();}
    finally{btn.disabled=false;}
    return;
  }
  if(!isAdmin){close(); return;}
  if(kind==='score'&&modal){

    if(Number.isNaN(sa)||Number.isNaN(sb)) return showErr('Scores must be whole numbers, 0 or more.');
    if((sa==null)!==(sb==null)) return showErr('Enter a score for both teams, or leave both blank to save just the court.');
    if(sa!=null&&sa===sb) return showErr('Scores can’t be tied. Play one more point to decide it.');
    if(modal.kind==='pool'){
      const {gid,a,b}=modal, sw=a>b; const x=sw?b:a, y=sw?a:b;
      put('matches',mkey(gid,a,b),{group:gid,a:x,b:y,sa:sw?sb:sa,sb:sw?sa:sb,court});
    } else put('pmatches',modal.id,{sa,sb,court});
    close(); toast(sa==null?'Court saved':'Score saved'); return;
  }
  if(kind==='group'&&modal){
    const name=String(fd.get('name')||'').trim(); if(!name) return showErr('Give the group a name.');
    const size=Number(fd.get('size'))||4, courts=String(fd.get('courts')||'').split(/[,\s]+/).map(Number).filter(n=>Number.isInteger(n)&&n>=1);
    if(modal.id){put('groups',modal.id,Object.assign({},S.groups[modal.id],{name,size,courts}));}
    else{const id=uid(); put('groups',id,{div:curDiv,name,size,courts,order:Date.now()});}
    close(); toast(modal&&modal.id?'Group saved':'Group saved'); return;
  }
  if(kind==='team'&&modal){
    const name=String(fd.get('name')||'').trim(); if(!name) return showErr('Give the team a name.');
    const div=fd.get('div'), group=fd.get('group')||'';
    const data={name,p1:String(fd.get('p1')||'').trim(),p2:String(fd.get('p2')||'').trim(),div,group};
    if(modal.id) put('teams',modal.id,Object.assign({},S.teams[modal.id],data));
    else put('teams',uid(),Object.assign(data,{order:Date.now()}));
    const wasNew=!modal.id; close(); toast(wasNew?'Team added':'Team saved');
  }
});

/* ---------- app actions ---------- */
app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el||/^(SELECT|INPUT|OPTION)$/.test(el.tagName)) return;
  const act=el.dataset.act, d=el.dataset;
  if(act==='div'){curDiv=d.v; saveUI(); render(); return;}
  if(act==='tab'){view=d.v; saveUI(); render(); window.scrollTo(0,0); return;}
  if(act==='admin'){pwForm(); return;}
  if(act==='lock'){setToken(null); if(view==='settings') view='groups'; render(); toast('Admin mode off'); return;}
  if(!isAdmin) return;
  if(act==='start'){put('meta','config',Object.assign(meta(),{started:true})); view='teams'; saveUI(); render(); return;}
  if(act==='scoring'){put('meta','config',Object.assign(meta(),{scoring:d.v,started:true})); return;}
  if(act==='addgroup'){const gs=groupsIn(curDiv), size=gs.length?gs[gs.length-1].size:4; groupForm({name:nextLetter(curDiv),size,courts:suggestCourts(size)}); const c=dlg.querySelector('input[name=courts]'); if(c){c.dataset.auto='1'; c.addEventListener('input',()=>{c.dataset.auto='0';},{once:true});} return;}
  if(act==='editgroup'){groupForm(Object.assign({id:d.id},S.groups[d.id])); return;}
  if(act==='addteam'){const gs=groupsIn(curDiv), open=gs.find(g=>members(g.id).length<g.size); teamForm({div:curDiv,group:open?open.id:''}); return;}
  if(act==='editteam'){teamForm(Object.assign({id:d.id},S.teams[d.id])); return;}
  if(act==='score'){openPool(d.g,d.a,d.b,d.r,d.p); return;}
  if(act==='poscore'){openPo(d.id); return;}
  if(act==='place'){placeUnassigned(); return;}
  if(act==='seed'){seedBracket(); return;}
  if(act==='sample'){loadSample(); return;}
  if(act==='adddiv'){
    const m=meta(), used=new Set(m.divisions.map(d=>d.color.toLowerCase())), color=PALETTE.find(c=>!used.has(c.toLowerCase()))||PALETTE[m.divisions.length%PALETTE.length];
    const id='d'+uid(); m.divisions.push({id,name:'Division '+(m.divisions.length+1),color}); m.started=true;
    put('meta','config',m); toast('Division added. Rename it here, then pick it at the top to add groups and teams.'); return;
  }
  if(act==='deldiv'){
    const id=d.id, nT=teamsIn(id).length, nG=groupsIn(id).length;
    if(nT||nG){toast(`Remove or move ${divName(id)}’s ${nT?nT+' team'+(nT===1?'':'s'):''}${nT&&nG?' and ':''}${nG?nG+' group'+(nG===1?'':'s'):''} first.`); return;}
    if(!(await askConfirm(`Remove the ${divName(id)} division?`,'Remove division'))) return;
    const m=meta(); m.divisions=m.divisions.filter(x=>x.id!==id);
    Object.keys(S.pmatches).filter(k=>k.startsWith(id+'--')).forEach(k=>del('pmatches',k));
    if(S.playoff[id]) del('playoff',id);
    put('meta','config',m); toast('Division removed'); return;
  }
  if(act==='reset'){if(await askConfirm('Reset everything? All teams, groups, scores and brackets are deleted for everyone.','Reset everything')) resetAll(); return;}
});
app.addEventListener('change',e=>{
  const el=e.target, act=el.dataset.act; if(!act||!isAdmin) return;
  if(act==='teamgroup'){put('teams',el.dataset.id,Object.assign({},S.teams[el.dataset.id],{group:el.value})); return;}
  if(act==='porule'){
    const pc=S.playoff[curDiv]||{}, R=rulesFor(curDiv), k=el.dataset.k;
    R[k]=(k==='count'||k==='perGroup')?Number(el.value):el.value;
    put('playoff',curDiv,Object.assign({},pc,{rules:R})); return;
  }
  if(act==='seedpick'){
    const pc=S.playoff[curDiv], seeds=(pc.seeds||[]).slice(), i=Number(el.dataset.i), v=el.value, j=seeds.indexOf(v);
    if(v&&j>=0&&j!==i) seeds[j]=seeds[i]; seeds[i]=v;
    put('playoff',curDiv,Object.assign({},pc,{seeds})); return;
  }
  if(act==='divname'||act==='divcolor'){
    const m=meta(), d=m.divisions.find(x=>x.id===el.dataset.id); if(!d) return;

    m.started=true; put('meta','config',m); toast('Saved');
  }
});

function placeUnassigned(){
  const un=teamsIn(curDiv).filter(t=>!t.group||!S.groups[t.group]), gs=groupsIn(curDiv);
  const counts=new Map(gs.map(g=>[g.id,members(g.id).length])); let placed=0;
  un.forEach(t=>{const open=gs.filter(g=>counts.get(g.id)<g.size).sort((a,b)=>counts.get(a.id)-counts.get(b.id)); if(!open.length) return; const g=open[0]; counts.set(g.id,counts.get(g.id)+1); put('teams',t.id,Object.assign({},S.teams[t.id],{group:g.id})); placed++;});
  toast(placed<un.length?`Placed ${placed}. ${un.length-placed} still need a spot: add a group or raise a group’s size.`:`Placed ${placed} team${placed===1?'':'s'}`);
}
async function seedBracket(){
  const pc=S.playoff[curDiv]||{}, q=qualify(curDiv);
  if(q.count<2){toast('At least two teams in groups are needed for a bracket.'); return;}
  const existing=Object.keys(S.pmatches).filter(k=>k.startsWith(curDiv+'--'));
  if(existing.some(k=>num(S.pmatches[k].sa))&&!(await askConfirm(`Reseeding clears the ${divName(curDiv)} playoff scores. Continue?`,'Reseed'))) return;
  existing.forEach(k=>del('pmatches',k));
  put('playoff',curDiv,Object.assign({},pc,{rules:q.R,rulesAtSeed:q.R,size:q.size,seeds:q.seeds}));
  toast(`Bracket created with ${q.count} teams`);
}
async function resetAll(){
  COLS.forEach(c=>S[c]={}); S.meta={}; render();
  const r=await send({reset:true});
  if(r&&r.ok) toast('Everything was reset');
}

/* ---------- sample ---------- */
async function loadSample(){
  if(Object.keys(S.teams).length&&!(await askConfirm('Loading the sample replaces all current teams, groups and scores.','Replace with sample'))) return;
  COLS.forEach(c=>S[c]={});
  send({reset:true});
  const names={blue:['Dink Dynasty','Kitchen Kings','Net Ninjas','Lob Squad','Paddle Pals','Third Shot Drop','Volley Llamas','Spin Doctors','Erne Express','Baseline Bandits','Rally Rebels','Drop Shot Divas','The Picklers','Sweet Spot','Court Jesters','Dill With It','Big Dill Energy','Zero Zero Start','Two Bounce Crew','Soft Hands'],
    gold:['Golden Paddles','Sunny Side Dinks','Honey Badgers','Gold Rush','Brine Time','Pickle Pros','Fresh Pickles','Kitchen Crashers','Slice Squad','Lucky Lobs','Dink Responsibly','Pickle Jar','Net Gains','Overhead Heroes','Rookie Rally','Paddle Royale','The Gherkins','Sour Power','Good Dills','First Serve']};
  const first=['Maya','Jordan','Priya','Sam','Elena','Marcus','Grace','Leo','Aisha','Tom','Nina','Chris','Olivia','Dev','Hannah','Ray','Sofia','Ben','Jade','Luis'];
  const last='ABCDEFGHJKLMNPRSTVWZ';
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  const ops=[]; let k=0, order=Date.now();
  SAMPLE_DIVS.forEach((d,di)=>{
    const gids=[];
    for(let gi=0;gi<5;gi++){const id=uid()+gi+d; gids.push(id); const C=meta().courts, g={div:d,name:'ABCDE'[gi],size:4,courts:[(gi*2)%C+1,(gi*2+1)%C+1],order:order++}; S.groups[id]=g; ops.push({col:'groups',id,data:g});}
    names[d].forEach((n,i)=>{const id=uid()+i+d; const t={name:n,p1:`${first[(i*3+di)%20]} ${last[(i*7+di*3)%20]}.`,p2:`${first[(i*3+di+11)%20]} ${last[(i*5+di+9)%20]}.`,div:d,group:gids[i%5],order:order++}; S.teams[id]=t; ops.push({col:'teams',id,data:t});});
  });
  // fill some results: Blue rounds 1-2, Gold round 1
  SAMPLE_DIVS.forEach(d=>groupsIn(d).forEach(g=>{const rr=rrRounds(members(g.id).map(t=>t.id)); rr.slice(0,d==='blue'?2:1).forEach(pairs=>pairs.forEach(([a,b])=>{const w=rnd()<.5, lo=3+Math.floor(rnd()*8); const sa=w?11:lo, sb=w?lo:11, sw=a>b; const doc={group:g.id,a:sw?b:a,b:sw?a:b,sa:sw?sb:sa,sb:sw?sa:sb,court:null}; const key=mkey(g.id,a,b); S.matches[key]=doc; ops.push({col:'matches',id:key,data:doc});}));}));
  S.meta=Object.assign(meta(),{started:true,divisions:DEF_DIVS.map(d=>Object.assign({},d))}); ops.push({col:'meta',id:'config',data:S.meta});
  view='groups'; saveUI(); render();
  await writeMany(ops,'Saving sample');
}

/* ---------- boot ---------- */
async function poll(force){
  if(document.hidden&&!force) return;
  const epoch=writeEpoch;
  try{
    const r=await fetch('/api/state'+(force||!booted?'':'?v='+ver),{cache:'no-store'});
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j) throw new Error((j&&j.error)||'Server error.');
    if(j.unchanged) return;
    if(pendingWrites||epoch!==writeEpoch) return;
    if(booted&&(j.ver||0)<ver) return;
    applyState(j);
  }catch(e){
    if(!booted) app.innerHTML='<div class="wrap loading">Can’t reach the tournament server yet. '+esc(e.message||'')+' Retrying…</div>';
  }
}
function boot(){
  poll(true);
  setInterval(poll,4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden) poll(true);});
}
render(); boot();
})();
</script>
